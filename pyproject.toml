[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-tray-buddy"
dynamic = ["version"]
description = "A tiny Linux system tray app that shows the status of an Ollama server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.4"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/gtradigo/ollama-tray-buddy"

[project.gui-scripts]
ollama-tray-buddy = "ollama_tray_buddy.app:main"

[tool.setuptools]
packages = ["ollama_tray_buddy"]

[tool.setuptools.dynamic]
version = { attr = "ollama_tray_buddy.__version__" }
